<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0D0D0D"/>
  <!-- Perfume bottle -->
  <!-- Bottle neck -->
  <rect x="12" y="4" width="8" height="4" rx="1.5" fill="url(#fg)"/>
  <!-- Spray nozzle -->
  <rect x="17" y="3" width="5" height="2.5" rx="1" fill="#C9A84C"/>
  <!-- Bottle body -->
  <rect x="8" y="8" width="16" height="18" rx="4" fill="url(#fg)"/>
  <!-- Shine -->
  <rect x="10" y="10" width="3" height="10" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  <!-- Sparkles -->
  <circle cx="26" cy="9" r="1.5" fill="#F0D080" opacity="0.9"/>
  <circle cx="24" cy="6" r="1" fill="#C9A84C" opacity="0.7"/>
  <!-- Letter A at bottom -->
  <text x="16" y="30" font-family="Georgia, serif" font-size="6" font-weight="700" text-anchor="middle" fill="#C9A84C" letter-spacing="1">AS</text>
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D080"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
</svg>
